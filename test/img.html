<!doctype html><meta charset=utf-8><script src="../src/app/vendor/hb.js"></script><script src="../src/app/vendor/hbjs.js"></script><script src="../src/app/vendor/kuromoji/kuromoji.js"></script><script src="../src/app/engine.js"></script><script>
async function init(){const t0=performance.now();const hb=hbjs(await createHarfBuzz({locateFile:f=>'../src/app/vendor/'+f}));EA.setShaper(hb);const j=async u=>(await fetch(u)).json();const buf=async u=>new Uint8Array(await (await fetch(u)).arrayBuffer());
EA.loadGlyphs(await j('../src/app/data/glyphs.json'));for(const [k,f] of [['sc','EASC'],['tc','EATC'],['jp','EAJP'],['kr','EAKR']])EA.loadFont(k,await buf('../src/app/fonts/'+f+'.ttf'));
EA.load('zh',await j('../src/app/data/zh/dict1.json'));EA.load('zh',await j('../src/app/data/zh/dict2.json'));EA.load('ts',await j('../src/app/data/zh/ts.json'));EA.load('st',await j('../src/app/data/zh/st.json'));EA.load('zhChars',await j('../src/app/data/zh/chars.json'));EA.load('ko',await j('../src/app/data/ko/dict.json'));EA.load('hanja',await j('../src/app/data/ko/hanja.json'));EA.load('ja',await j('../src/app/data/ja/dict1.json'));EA.load('ja',await j('../src/app/data/ja/dict2.json'));EA.load('ja',await j('../src/app/data/ja/dict3.json'));
await new Promise(r=>kuromoji.builder({dicPath:'../src/app/vendor/kuromoji/dict/'}).build((e,t)=>{if(!e)EA.setTokenizer(t);r();}));
for(const k of ['sc','tc','jp','kr'])EA.loadTemplates(k,await j('../src/app/data/tpl/'+k+'.json'),(await buf('../src/app/data/tpl/'+k+'.bin')).buffer);return Math.round(performance.now()-t0);}
function loadImg(src){return new Promise((r,e)=>{const i=new Image();i.onload=()=>r(i);i.onerror=e;i.src=src;});}
async function rasterise(svg,scale,fmt,q){const im=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
 if(fmt==='jpeg'){const im2=await loadImg(c.toDataURL('image/jpeg',q));x.drawImage(im2,0,0);}return x.getImageData(0,0,c.width,c.height);}
async function run(text,lang,theme,scale,fmt,q,vert,ruby){const svg=EA.render(text,{lang,theme,size:40,width:900,height:700,vertical:vert,ruby});const id=await rasterise(svg,scale,fmt,q);const t0=performance.now();const r=EA.readImage(id,'auto');
 const norm=s=>s.replace(/\s+/g,'');const shown=vert?EA.verticalMarks(text).replace(/[，．！？：；]/g,c=>lang==='ko'?({'，':',','．':'.','！':'!','？':'?','：':':','；':';'})[c]:c).replace(/．/g,'。'):text;const want=norm(shown),got=r.ok?norm(r.text):'';
 const sameZh=/^zh/.test(lang)&&/^zh/.test(r.lang||'')&&EA.toSimplified(text)===EA.toTraditional(text);
 let same=0;const a=[...got],b=[...want];for(let i=0;i<Math.min(a.length,b.length);i++)if(a[i]===b[i])same++;
 return {exact:got===want&&(r.lang===lang||sameZh),chars:same,total:b.length,lenOK:a.length===b.length,got:r.ok?r.text:null,lang:r.lang,want:text,reason:r.reason,conf:r.confidence,unc:r.uncertain,ms:Math.round(performance.now()-t0),w:id.width,h:id.height};}
async function decodeUrl(u){const im=await loadImg(u);const sc=Math.min(1,2400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);const d=EA.readImage(x.getImageData(0,0,c.width,c.height),'auto');return {ok:d.ok,text:d.text,reason:d.reason,conf:d.confidence};}
</script>
